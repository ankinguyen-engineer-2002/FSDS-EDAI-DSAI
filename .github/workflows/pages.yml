name: Deploy FSDS Study Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static Pages artifact
        run: |
          mkdir -p _site/content _site/assets
          cp fsds-learning-hub.html _site/index.html
          cp fsds-learning-hub.html _site/fsds-learning-hub.html
          if [ -d content ]; then cp -R content/* _site/content/ 2>/dev/null || true; fi
          if [ -d assets ]; then cp -R assets/* _site/assets/ 2>/dev/null || true; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

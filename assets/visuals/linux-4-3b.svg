<text x="964" y="292.0" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│    1. Quên đường dẫn tuyệt đối (/usr/bin/python3,        │     │    chạy lại! ──&gt; Giải</text>

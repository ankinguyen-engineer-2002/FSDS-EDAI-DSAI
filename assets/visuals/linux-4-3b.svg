<text x="964" y="366.0" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│    3. Đặt nhầm sổ Crontab (crontab -e của User thường    │     │    ──&gt; Giải pháp: Dùn</text>
<text x="964" y="384.5" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│       vs sudo crontab -e của Root dẫn đến thiếu quyền).  │     │        (tự chạy bù kh</text>
<text x="964" y="403.0" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">└──────────────────────────────────────────────────────────┘     └──────────────────────</text>

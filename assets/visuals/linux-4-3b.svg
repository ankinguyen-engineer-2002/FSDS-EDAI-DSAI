<text x="964" y="329.0" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│    2. Quên thu gom log (&gt;&gt; /var/log/backup.log 2&gt;&amp;1)     │     │  • [Giới hạn 2] Misse</text>

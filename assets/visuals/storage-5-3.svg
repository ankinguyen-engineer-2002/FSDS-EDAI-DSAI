<line x1="92" y1="86" x2="92" y2="114" stroke="#67e8f9" stroke-width="1.4"/>
<rect x="138" y="54" width="246" height="24" rx="6" fill="#0e2936" stroke="#06b6d4" stroke-width="1"/>
<text x="261" y="71" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" text-anchor="middle">STYLE #2 · PROMPT-STORY-ANALOGY</text>
<text x="400" y="71" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">VISUAL ASSET: STORAGE-5-3 · STATION 5.3</text>
<text x="138" y="109" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="700">Hình 5.3a — Giải mã 3 Lỗ hổng Công cụ cốt tử (The 3 Tooling Gaps) biến Data Lake thành Data Swam</text>
<rect x="53" y="158" width="1504" height="532" rx="14" fill="#070b10" opacity="0.65"/>
<rect x="48" y="152" width="1504" height="532" rx="14" fill="#111923" stroke="#06b6d4" stroke-width="2"/>
<rect x="48" y="152" width="1504" height="48" rx="14" fill="#0e2936" stroke="#06b6d4" stroke-width="1.5"/>
<circle cx="74" cy="176" r="13" fill="#0b1017" stroke="#06b6d4" stroke-width="1.5"/>
<text x="74" y="181" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="96" y="181" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">ARCHITECTURAL STAGE · 5.3</text>
<rect x="64" y="218" width="1472" height="100" rx="10" fill="#162230" stroke="#06b6d4" stroke-opacity="0.65" stroke-width="1.4"/>
<rect x="64" y="218" width="6" height="100" rx="3" fill="#06b6d4"/>
<text x="82" y="244" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">DATA SWAMP (ĐẦM LẦY DỮ LIỆU)</text>
<line x1="800" y1="318" x2="800" y2="332" stroke="#06b6d4" stroke-width="2"/>
<rect x="64" y="334" width="1472" height="100" rx="10" fill="#162230" stroke="#06b6d4" stroke-opacity="0.65" stroke-width="1.4"/>
<rect x="64" y="334" width="6" height="100" rx="3" fill="#06b6d4"/>
<text x="82" y="360" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">1. LỖ HỔNG GIAO DỊCH &amp; CÔNG CỤ (ACID / Mutability)</text>
<text x="82" y="382" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">• Không có ACID: Job ETL đụng độ truy vấn đọc</text>
<text x="82" y="404" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">• Bất biến (Immutable): Không thể Upsert / Xóa lẻ GDPR</text>
<text x="82" y="426" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">• Không chặn được Schema Drift lúc nạp</text>
<line x1="800" y1="434" x2="800" y2="448" stroke="#06b6d4" stroke-width="2"/>
<rect x="64" y="450" width="1472" height="100" rx="10" fill="#162230" stroke="#06b6d4" stroke-opacity="0.65" stroke-width="1.4"/>
<rect x="64" y="450" width="6" height="100" rx="3" fill="#06b6d4"/>
<text x="82" y="476" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">2. THIẾU DATA CATALOG &amp; METADATA MGMT</text>
<text x="82" y="498" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">• Không biết bảng nào ở đâu, ý nghĩa cột là gì</text>
<text x="82" y="520" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">• Thiếu người sở hữu rõ ràng (Ownership / Steward)</text>
<text x="82" y="542" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">• Tạo ra Dark Data / WORN &amp; rủi ro rò rỉ dữ liệu</text>
<line x1="800" y1="550" x2="800" y2="564" stroke="#06b6d4" stroke-width="2"/>
<rect x="64" y="566" width="1472" height="100" rx="10" fill="#162230" stroke="#06b6d4" stroke-opacity="0.65" stroke-width="1.4"/>
<rect x="64" y="566" width="6" height="100" rx="3" fill="#06b6d4"/>
<text x="82" y="592" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">3. THIẾU DATA LINEAGE &amp; OBSERVABILITY</text>
<text x="82" y="614" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">• Không truy vết được dữ liệu sinh ra từ nguồn nào,</text>
<text x="82" y="636" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">qua bước biến đổi nào mà bị sai lệch / NULL</text>
<text x="82" y="658" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">• Thiếu 5 trụ cột giám sát &amp; Quality Checks tự động</text>
<rect x="48" y="702" width="1504" height="58" rx="10" fill="#0f1824" stroke="#334155" stroke-width="1.4"/>
<text x="68" y="736" fill="#fcd34d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">KEY METRICS &amp; INVARIANTS:</text>
<rect x="290" y="714" width="130" height="34" rx="8" fill="#0e2936" stroke="#06b6d4" stroke-width="1.2"/>
<text x="355" y="736" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" text-anchor="middle">ACID</text>
<rect x="48" y="774" width="1504" height="82" rx="12" fill="#131c27" stroke="#10b981" stroke-width="1.5"/>
<text x="68" y="800" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">CAUSAL MECHANISM &amp; ARCHITECTURAL TAKEAWAY:</text>
<text x="68" y="824" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Ba lỗ hổng kiến trúc khiến Data Lake 1.0 suy thoái thành Data Swamp: (1) Thiếu giao dịch ACID và tính khả biến (Mutability), (2) Thiếu Data</text>
<text x="68" y="845" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Catalog, quản trị Metadata và quyền sở hữu (Ownership), (3) Thiếu Data Lineage, Observability và kiểm soát chất lượng tự động.</text>
</svg>
<text x="964" y="236.5" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">┌──────────────────────────────────────────────────────────┐     ┌──────────────────────</text>
<text x="964" y="255.0" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│  • [1] Cron    : Hệ thống lập lịch tự động trên Linux.   │     │  • Cú pháp: [Phút] [G</text>
<text x="964" y="273.5" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│  • [2] Crontab : Bảng thời gian biểu (file cấu hình)     │     │    - Trường 1: Phút (</text>
<text x="964" y="292.0" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│    - crontab -e (Sửa) | crontab -l (Xem) | -r (Xóa)      │ ──&gt; │    - Trường 3: Ngày (</text>
<text x="964" y="310.5" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│  • [3] Cronjob : Từng dòng công việc cụ thể hẹn giờ.     │     │    - Trường 5: Thứ  (</text>
<text x="964" y="329.0" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│  • [4] Crond   : Tiến trình ngầm (Daemon) trực 24/7,     │     │  • 4 Ký tự điều khiển</text>
<text x="964" y="347.5" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">│    thức dậy đúng mỗi 60 giây để rà bảng Crontab.         │     │    * (Mọi giá trị) | </text>
<text x="964" y="366.0" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" xml:space="preserve">└──────────────────────────────────────────────────────────┘     │    - (Khoảng: 1-5) | </text>

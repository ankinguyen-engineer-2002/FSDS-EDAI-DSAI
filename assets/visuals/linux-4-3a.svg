<text x="68" y="826" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Giải phẫu 4 khái niệm Cron/Crontab/Cronjob/Crond và 5 trường thời gian của Crontab sắp xếp từ đơn vị nhỏ đến lớn: Phút (0-59) ➔ Giờ (0-23) ➔ Ngày</text>
<text x="68" y="846" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">trong tháng (1-31) ➔ Tháng (1-12) ➔ Thứ trong tuần (0-6 hoặc 0-7, Chủ Nhật = 0 hoặc 7), cùng 4 ký tự *, ,, -, /.</text>

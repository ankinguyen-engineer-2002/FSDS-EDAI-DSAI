<text x="68" y="800" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">CAUSAL MECHANISM &amp; ARCHITECTURAL TAKEAWAY:</text>
<text x="68" y="824" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Sự phối hợp giữa 3 dịch vụ bảo trì vật lý: (1) Compaction (OPTIMIZE) gộp hàng vạn tệp nhỏ thành tệp chuẩn 128 MB – 1 GB; (2) Deletion Vectors</text>
<text x="68" y="845" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">dùng Roaring Bitmap đánh dấu xóa mềm tức thì; (3) Vacuum / Expire Snapshots dọn rác vật lý sau chu kỳ lưu giữ 168 giờ.</text>
